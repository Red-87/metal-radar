name: Metal Radar Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt

      - name: Avvia Metal Radar
        run: |
          python main.py
